[package]
name = "sao-gifski"
version = "1.0.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["staticlib"]

[dependencies]
gifski = { version = "=1.34.0", default-features = false }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
debug = false
