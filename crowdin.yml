# Optional maintainer tooling. No Crowdin account, credentials or SDK is needed to submit XML PRs.
project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: .
preserve_hierarchy: true
files:
  - source: /app/src/main/res/values/*strings.xml
    translation: /app/src/main/res/values-%android_code%/%original_file_name%
    skip_untranslated_strings: true
  - source: /source-settings/src/main/res/values/*strings.xml
    translation: /source-settings/src/main/res/values-%android_code%/%original_file_name%
    skip_untranslated_strings: true
