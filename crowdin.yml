# Community translations use one public Crowdin project for SAO and all source APKs.
# Connect both repositories using Crowdin's native GitHub integration.
# Optional CLI credentials below are environment variable names, never stored tokens.
project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: .
preserve_hierarchy: true
pull_request_title: Update translations from Crowdin
commit_message: Translate %original_file_name% (%language%) [ci skip]
append_commit_message: false
files:
  - source: /app/src/main/res/values/*strings.xml
    translation: /app/src/main/res/values-%android_code%/%original_file_name%
    skip_untranslated_strings: true
    type: android
    labels:
      - SAO app
    update_option: update_as_unapproved
  - source: /source-settings/src/main/res/values/*strings.xml
    translation: /source-settings/src/main/res/values-%android_code%/%original_file_name%
    skip_untranslated_strings: true
    type: android
    labels:
      - Shared extension settings
    update_option: update_as_unapproved
