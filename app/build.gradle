plugins {
    alias libs.plugins.android.application
    // Data Binding still requires kapt; Hilt and Room use KSP.
    alias libs.plugins.legacy.kapt
    alias libs.plugins.ksp
    alias libs.plugins.dagger.android

    alias libs.plugins.safe.args
}

android {
    namespace 'one.njk.sao'
    compileSdk 37

    defaultConfig {
        applicationId "one.njk.sao"
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        prerelease {
            // Testing configuration
            debuggable true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            applicationIdSuffix ".testing" // Add a suffix to the application ID for differentiation
            matchingFallbacks = ['release']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        aidl true
        viewBinding true
        dataBinding true
        buildConfig true
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Opt in per development machine, without imposing a Samba path on other contributors.
def debugApkShareDir = providers.gradleProperty('sao.debugApkShareDir')
androidComponents {
    onVariants(selector().withBuildType('debug')) { variant ->
        if (debugApkShareDir.isPresent()) {
            def variantTaskName = variant.name.capitalize()
            def sourceApk = variant.artifacts.get(com.android.build.api.artifact.SingleArtifact.APK.INSTANCE)
                .map { it.file('app-debug.apk') }
            def sharedApk = debugApkShareDir.map { new File(it, 'app-debug.apk') }
            def publishApk = tasks.register("copy${variantTaskName}ApkToShare") {
                inputs.file(sourceApk)
                // Track this file only; never traverse or snapshot the rest of the user's share.
                outputs.file(sharedApk)
                outputs.upToDateWhen { false }
                doLast {
                    java.nio.file.Files.copy(sourceApk.get().asFile.toPath(), sharedApk.get().toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
            }
            tasks.matching { it.name == "package${variantTaskName}" || it.name == "assemble${variantTaskName}" }.configureEach {
                finalizedBy(publishApk)
            }
        }
    }
}

dependencies {
    implementation project(':immich')
    implementation "com.caverock:androidsvg-aar:1.4"
    // Supplied by LSPosed in the scoped process; never bundled into ordinary SAO.
    compileOnly libs.libxposed.api

    // androidx libs, layouts, material design
    implementation libs.bundles.androidx
    implementation libs.android.material
    implementation libs.media3.exoplayer
    implementation libs.media3.transformer
    implementation libs.media3.ui
    
    // Testing
    testImplementation libs.junit
    androidTestImplementation libs.bundles.testing
    androidTestImplementation libs.mockwebserver

    // Navigation graph support
    implementation libs.bundles.nav

    // Coroutines, coil, dagger hilt, retrofit
    implementation libs.coroutines
    implementation libs.bundles.coil
    implementation libs.bundles.retrofit
    implementation libs.dagger.android
    ksp libs.dagger.compiler

    // ROOM
    implementation libs.room.ktx
    ksp libs.room.compiler
}
