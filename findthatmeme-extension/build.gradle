plugins { alias libs.plugins.android.application }

android {
    namespace 'one.njk.sao.extension.findthatmeme'
    compileSdk 37
    defaultConfig {
        applicationId 'one.njk.sao.extension.findthatmeme'
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
    buildFeatures { viewBinding true; buildConfig true }
    sourceSets { main { assets.srcDir rootProject.file('third_party/material-symbols') } }
}

dependencies {
    implementation project(':source-api')
    implementation project(':source-settings')
    implementation libs.okhttp
    implementation libs.androidx.appcompat
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.runtime
    implementation libs.android.material
    androidTestImplementation libs.bundles.testing
    androidTestImplementation libs.mockwebserver
}
