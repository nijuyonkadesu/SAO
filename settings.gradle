pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "SAO"
include ':app'
include ':immich'

include ':source-api'
include ':source-settings'
include ':immich-provider'
include ':immich-extension'

include ':local-extension'
include ':moeview'
include ':moeview-extension'
