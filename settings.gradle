pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        ivy {
            name = 'SourceTestSupport'
            url = 'https://github.com/nijuyonkadesu/SAO-extensions/releases/download/source-test-support-1.0.0'
            patternLayout {
                artifact '[artifact]-[revision](-[classifier]).[ext]'
                ivy '[module]-[revision].ivy.xml'
            }
            metadataSources { ivyDescriptor() }
            content { includeGroup 'one.njk.sao.extensions' }
        }
    }
}
rootProject.name = 'SAO'
include ':app', ':source-api', ':source-settings', ':gif-encoder', ':media-decoder'
